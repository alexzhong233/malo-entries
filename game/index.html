<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR SIPHON</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(circle at 70% 20%, #18205c 0%, #0a1035 42%, #170b38 100%); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="STAR SIPHON: pilot your drone to attract and repel energy motes into the core while avoiding void rifts"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
